server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Serve the .gz the image built beside each runtime file. Compressing on the
    # fly would be the wrong trade on a Raspberry Pi: love.wasm is 4.7 MB and
    # never changes, so it is gzipped once at build time rather than once per
    # visitor. There is nothing here to compress that the image did not.
    gzip_static on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The card art, which the packer deliberately leaves out of game.love — see
    # BESIDE_PAGE in game/cards.lua, which is the other half of this and has the
    # reasons. Served straight off the same bind mount the desktop reads, so
    # there is one copy and no sync. `^~` so nothing below can claim a file
    # under here by its extension, and no-cache so that editing a picture shows
    # up on reload, the same bargain game.love makes.
    location ^~ /assets/ {
        alias /workspace/game/games/assets/;
        add_header Cache-Control "no-cache";
    }

    # The love.js runtime is 5 MB and fixed for the life of the image, so it is
    # worth a year in the browser's cache. A rebuild is a new container and a
    # fresh copy, never a stale file answering to the same name.
    location ~* ^/(11\.5|lovejs)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # game.love is repacked on every save, so it has to revalidate. It is a zip
    # already — gzip takes 0.1% off it — so it is served as it lies.
    location ~* \.(js|wasm|love|data|json|css)$ {
        add_header Cache-Control "no-cache";
    }
}
